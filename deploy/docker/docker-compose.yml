# Homelab: PostgreSQL, SplitSpends, Caddy with automatic HTTPS, and nightly
# database dumps in ./backups (prune old dumps yourself).
#   cp ../.env.example .env   # set DOMAIN, BASE_URL=https://<DOMAIN>, POSTGRES_PASSWORD, SECRET_KEY, SMTP
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: splitspends
      POSTGRES_USER: splitspends
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitspends -d splitspends"]
      interval: 5s
      retries: 10

  app:
    build:
      context: ../..
    image: splitspends:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://splitspends:${POSTGRES_PASSWORD}@db:5432/splitspends?sslmode=disable
      TRUST_PROXY: "true"
    volumes:
      - data:/data
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      - app

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump -h db -U splitspends -Fc splitspends > /backups/splitspends-$$(date +%F).dump
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

volumes:
  db:
  data:
  caddy:
