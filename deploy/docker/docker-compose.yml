# Homelab: PostgreSQL, Split Spends, Caddy with automatic HTTPS, and nightly
# backups of the database and receipts in ./backups, kept for BACKUP_KEEP_DAYS
# days (restore steps in docs/HOSTING.md).
#   cp ../.env.example .env   # set DOMAIN, BASE_URL=https://<DOMAIN>, POSTGRES_PASSWORD, SECRET_KEY, SMTP
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: splitspends
      POSTGRES_USER: splitspends
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitspends -d splitspends"]
      interval: 5s
      retries: 10

  app:
    build:
      context: ../..
    image: splitspends:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://splitspends:${POSTGRES_PASSWORD}@db:5432/splitspends?sslmode=disable
      # Caddy replaces X-Forwarded-For with the address that connected to it.
      TRUST_PROXY: "1"
    volumes:
      - data:/data
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      app:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - data:/data:ro
    entrypoint: ["/bin/sh", "-c"]
    # Each file is written under a temporary name and renamed only when it is
    # complete, so a failed run never leaves a broken file that looks like a
    # backup. Each kind is pruned only after a good run of that kind, so a
    # database that stays down does not age every good backup out.
    command:
      - |
        umask 077
        while true; do
          stamp=$$(date +%F-%H%M)
          dump=/backups/splitspends-$$stamp.dump
          receipts=/backups/receipts-$$stamp.tar.gz
          if pg_dump -h db -U splitspends -Fc -f "$$dump.tmp" splitspends; then
            mv "$$dump.tmp" "$$dump"
            echo "backup.dump.saved file=$$dump"
            find /backups -maxdepth 1 -type f -name 'splitspends-*' -mtime +"$$BACKUP_KEEP_DAYS" -delete
          else
            rm -f "$$dump.tmp"
            echo "backup.dump.failed file=$$dump" >&2
          fi
          if tar -czf "$$receipts.tmp" -C /data .; then
            mv "$$receipts.tmp" "$$receipts"
            echo "backup.receipts.saved file=$$receipts"
            find /backups -maxdepth 1 -type f -name 'receipts-*' -mtime +"$$BACKUP_KEEP_DAYS" -delete
          else
            rm -f "$$receipts.tmp"
            echo "backup.receipts.failed file=$$receipts" >&2
          fi
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

volumes:
  db:
  data:
  caddy:
