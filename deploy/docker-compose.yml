# Production-style stack: PostgreSQL plus the Split Spends image.
#   cp deploy/.env.example deploy/.env   # then edit it
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: splitspends
      POSTGRES_USER: splitspends
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitspends -d splitspends"]
      interval: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: splitspends:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://splitspends:${POSTGRES_PASSWORD}@db:5432/splitspends?sslmode=disable
    volumes:
      - data:/data
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db:
  data:
