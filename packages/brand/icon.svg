<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>SplitSpends</title>
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12907A"/>
      <stop offset="1" stop-color="#0A5E4E"/>
    </linearGradient>
    <mask id="cut">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="632" cy="512" r="272" fill="#000"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#teal)"/>
  <g mask="url(#cut)">
    <circle cx="392" cy="512" r="232" fill="#FFFFFF"/>
    <circle cx="392" cy="512" r="167" fill="none" stroke="#D6EFE6" stroke-width="16"/>
  </g>
  <circle cx="632" cy="512" r="232" fill="#9DEBCF"/>
  <circle cx="632" cy="512" r="167" fill="none" stroke="#6FD3B2" stroke-width="16"/>
</svg>
