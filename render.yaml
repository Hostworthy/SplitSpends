# Render Blueprint: https://render.com/deploy?repo=https://github.com/atb00ker/SplitSpends
# Free web service plus a free PostgreSQL database. Render's free database
# expires after 30 days: for a lasting free setup, remove the database below
# and set DATABASE_URL to a Neon or Supabase free database instead.
services:
  - type: web
    name: splitspends
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: splitspends-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: SIGNUP_MODE
        value: invite
      - key: BLOB_STORE
        value: postgres
      - key: TRUST_PROXY
        value: "true"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: AI_PROVIDER
        value: none

databases:
  - name: splitspends-db
    plan: free
    databaseName: splitspends
    user: splitspends
