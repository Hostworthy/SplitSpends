# Proposes dependency updates as pull requests, so pinned versions are bumped
# through review instead of going stale.
version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot moves the SHA and
  # the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  # One entry for the whole pub workspace: pubspec.lock lives at the root.
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    groups:
      pub:
        patterns: ["*"]

  # Base images in the root Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]
