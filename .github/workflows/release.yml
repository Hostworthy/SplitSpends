name: Release

# Push a tag such as v0.1.0 (or v0.1.0-alpha.1 for a pre-release) to build
# every artifact and publish a GitHub release:
#   git tag v0.1.0-alpha.1 && git push origin v0.1.0-alpha.1
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# A moved tag queues behind the run already in progress instead of racing it
# to upload assets and push the image.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      build_name: ${{ steps.v.outputs.build_name }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      flutter: ${{ steps.v.outputs.flutter }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Full history, so the tagged commit can be checked against main.
          fetch-depth: 0
      - id: v
        run: |
          tag="${GITHUB_REF_NAME}"
          # Only plain version tags: everything below uses the tag in commands.
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag $tag is not a version like v1.2.3 or v1.2.3-alpha.1"; exit 1
          fi
          # Releases come only from reviewed code: the tagged commit must be on main.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $tag points to $GITHUB_SHA, which is not on main. Tag a commit on main."; exit 1
          fi
          core="${tag#v}"
          core="${core%%-*}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # App stores want plain x.y.z; the full tag stays in the file names.
          echo "build_name=$core" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"
          echo "flutter=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

  # The same checks as pull requests, on the tagged commit; nothing is built
  # or published unless they pass.
  ci:
    name: ci
    needs: version
    uses: ./.github/workflows/ci.yml

  server:
    name: server ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: [version, ci]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          name="splitspends-server-${TAG}-${GOOS}-${GOARCH}"
          mkdir -p "dist/$name"
          make build VERSION="$TAG" BIN="dist/$name"
          scripts/release/notices.sh "dist/$name/THIRD_PARTY_NOTICES.txt"
          cp LICENSE README.md "dist/$name/"
          cp apps/api/.env.example "dist/$name/env.example"
          cd dist
          if [ "$GOOS" = windows ]; then zip -qr "$name.zip" "$name"; else tar -czf "$name.tar.gz" "$name"; fi
          rm -rf "$name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  web:
    name: web
    needs: [version, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ needs.version.outputs.flutter }}
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - name: Build and package
        env:
          TAG: ${{ needs.version.outputs.tag }}
          BUILD_NAME: ${{ needs.version.outputs.build_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        working-directory: apps/web
        run: |
          flutter build web --release --no-web-resources-cdn \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          mkdir -p ../../dist
          tar -C build -czf "../../dist/splitspends-web-${TAG}.tar.gz" web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-web
          path: dist/*

  android:
    name: android
    needs: [version, ci]
    runs-on: ubuntu-latest
    outputs:
      cert: ${{ steps.cert.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ needs.version.outputs.flutter }}
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - name: Build
        # Without the signing secrets the APK is signed with a debug key the
        # runner generates afresh, so it cannot update an earlier install; the
        # file name and the release notes say so. The key is written and
        # removed within this step so no later step can read it.
        env:
          TAG: ${{ needs.version.outputs.tag }}
          BUILD_NAME: ${{ needs.version.outputs.build_name }}
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: apps/apk
        run: |
          trap 'rm -f android/upload-keystore.jks android/key.properties' EXIT
          apk="splitspends-android-${TAG}.apk"
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > android/upload-keystore.jks
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$PWD/android/upload-keystore.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          else
            apk="splitspends-android-${TAG}-debug-signed.apk"
            echo "::warning::No Android signing secrets: the APK is signed with a new debug key and cannot update an earlier install. See docs/RELEASING.md."
          fi
          flutter build apk --release \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          mkdir -p ../../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../../dist/$apk"
      - name: Signing certificate
        # The release notes show the certificate's SHA-256 so people can check
        # a downloaded APK, for example with apksigner or AppVerifier.
        id: cert
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          sha256=$("$tools/apksigner" verify --print-certs apps/apk/build/app/outputs/flutter-apk/app-release.apk |
            sed -n 's/^Signer #1 certificate SHA-256 digest: \([0-9a-f]\{64\}\)$/\1/p')
          [ -n "$sha256" ] || { echo "::error::apksigner printed no signing certificate digest."; exit 1; }
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start the release APK on an Android emulator
        # Only the release build has R8 shrinking and the release signing, so
        # the APK that is published must start before it is uploaded.
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: scripts/ci/release-smoke.sh apps/apk/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: release-logcat
          path: release-logcat.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-android
          path: dist/*

  ios:
    name: ios (unsigned)
    needs: [version, ci]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ needs.version.outputs.flutter }}
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - name: Build an unsigned IPA
        # Installing needs your own signing (Xcode, AltStore, Sideloadly) until
        # the project has an Apple Developer account in CI.
        env:
          TAG: ${{ needs.version.outputs.tag }}
          BUILD_NAME: ${{ needs.version.outputs.build_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        working-directory: apps/ios
        run: |
          flutter build ios --release --no-codesign \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          mkdir -p Payload ../../dist
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr "../../dist/splitspends-ios-${TAG}-unsigned.ipa" Payload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-ios
          path: dist/*

  docker:
    name: docker image
    needs: [version, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Signing and storing the provenance attestation.
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        env:
          # No build record artifact; the release only needs the image.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          push: true
          platforms: linux/amd64
          # Full build provenance and a software bill of materials, stored
          # with the image in the registry.
          provenance: mode=max
          sbom: true
          build-args: VERSION=${{ needs.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.tag }}
            org.opencontainers.image.title=Split Spends
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.version.outputs.tag }}
            ${{ needs.version.outputs.prerelease == 'false' && format('{0}:latest', steps.image.outputs.name) || '' }}
      # A signed attestation that this workflow built the pushed digest, which
      # `gh attestation verify oci://<image>` checks.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  release:
    name: publish
    needs: [version, ci, server, web, android, ios, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          # Only this workflow's files: the Docker job also stores a build
          # record artifact (*.dockerbuild) that download-artifact cannot fetch.
          pattern: release-*
          merge-multiple: true
      - name: Checksums and notes
        env:
          TAG: ${{ needs.version.outputs.tag }}
          DIGEST: ${{ needs.docker.outputs.digest }}
          CERT: ${{ needs.android.outputs.cert }}
        run: |
          [ -n "$DIGEST" ] || { echo "::error::The docker job reported no image digest."; exit 1; }
          cd dist && sha256sum * > SHA256SUMS && cd ..
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          apk="splitspends-android-${TAG}.apk"; apk_note=""
          if [ -e "dist/splitspends-android-${TAG}-debug-signed.apk" ]; then
            apk="splitspends-android-${TAG}-debug-signed.apk"
            apk_note=" **Signed with a temporary key**: it cannot update an earlier install, so uninstall the old app first, which removes its local data."
          fi
          [ -n "$CERT" ] || { echo "::error::The android job reported no signing certificate digest."; exit 1; }
          apk_note="${apk_note} Signing certificate SHA-256: \`${CERT}\`."
          sed -e "s|{{TAG}}|${TAG}|g" -e "s|{{REPO}}|${GITHUB_REPOSITORY}|g" \
            -e "s|{{APK}}|${apk}|g" -e "s|{{APK_NOTE}}|${apk_note}|g" \
            -e "s|{{IMAGE}}|${name}:${TAG}|g" -e "s|{{IMAGE_DIGEST}}|${name}@${DIGEST}|g" \
            .github/release-notes.md > notes.md
      # A signed attestation that this workflow built every file; checksums
      # alone cannot show that, since they are published next to the files.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Split Spends ${{ needs.version.outputs.tag }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          body_path: notes.md
          generate_release_notes: true
          files: dist/*
