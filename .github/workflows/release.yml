name: Release

# Push a tag such as v0.1.0 (or v0.1.0-alpha.1 for a pre-release) to build
# every artifact and publish a GitHub release:
#   git tag v0.1.0-alpha.1 && git push origin v0.1.0-alpha.1
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.50.1

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      build_name: ${{ steps.v.outputs.build_name }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        run: |
          tag="${GITHUB_REF_NAME}"
          # Only plain version tags: everything below uses the tag in commands.
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag $tag is not a version like v1.2.3 or v1.2.3-alpha.1"; exit 1
          fi
          core="${tag#v}"
          core="${core%%-*}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # App stores want plain x.y.z; the full tag stays in the file names.
          echo "build_name=$core" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"

  server:
    name: server ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          name="splitspends-server-${TAG}-${GOOS}-${GOARCH}"
          mkdir -p "dist/$name"
          go build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o "dist/$name/splitspends$ext" ./apps/api
          go build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o "dist/$name/splitspends-mcp$ext" ./apps/mcp
          cp LICENSE README.md "dist/$name/"
          cp apps/api/.env.example "dist/$name/env.example"
          cd dist
          if [ "$GOOS" = windows ]; then zip -qr "$name.zip" "$name"; else tar -czf "$name.tar.gz" "$name"; fi
          rm -rf "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  web:
    name: web
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Build and package
        env:
          TAG: ${{ needs.version.outputs.tag }}
        working-directory: apps/web
        run: |
          flutter build web --release --no-web-resources-cdn \
            --build-name=${{ needs.version.outputs.build_name }} --build-number=${{ github.run_number }}
          mkdir -p ../../dist
          tar -C build -czf "../../dist/splitspends-web-${TAG}.tar.gz" web
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/*

  android:
    name: android
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Release signing key (optional)
        # Without these secrets the APK is signed with the debug key: fine to
        # install directly, not accepted by Google Play.
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: apps/apk/android
        run: |
          if [ -z "$KEYSTORE" ]; then echo "No signing secrets: using the debug key."; exit 0; fi
          echo "$KEYSTORE" | base64 -d > upload-keystore.jks
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$PWD/upload-keystore.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > key.properties
      - name: Build
        env:
          TAG: ${{ needs.version.outputs.tag }}
        working-directory: apps/apk
        run: |
          flutter build apk --release \
            --build-name=${{ needs.version.outputs.build_name }} --build-number=${{ github.run_number }}
          mkdir -p ../../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../../dist/splitspends-android-${TAG}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  ios:
    name: ios (unsigned)
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Build an unsigned IPA
        # Installing needs your own signing (Xcode, AltStore, Sideloadly) until
        # the project has an Apple Developer account in CI.
        env:
          TAG: ${{ needs.version.outputs.tag }}
        working-directory: apps/ios
        run: |
          flutter build ios --release --no-codesign \
            --build-name=${{ needs.version.outputs.build_name }} --build-number=${{ github.run_number }}
          mkdir -p Payload ../../dist
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr "../../dist/splitspends-ios-${TAG}-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*

  docker:
    name: docker image
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: VERSION=${{ needs.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.tag }}
            org.opencontainers.image.title=Split Spends
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.version.outputs.tag }}
            ${{ needs.version.outputs.prerelease == 'false' && format('{0}:latest', steps.image.outputs.name) || '' }}

  release:
    name: publish
    needs: [version, server, web, android, ios, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          cd dist && sha256sum * > SHA256SUMS && cd ..
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${TAG}"
          sed -e "s|{{TAG}}|${TAG}|g" -e "s|{{IMAGE}}|${image}|g" .github/release-notes.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Split Spends ${{ needs.version.outputs.tag }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          body_path: notes.md
          generate_release_notes: true
          files: dist/*
