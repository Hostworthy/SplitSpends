name: Release

# Push a tag such as v0.1.0 (or v0.1.0-alpha.1 for a pre-release) to build
# every artifact and publish a GitHub release:
#   git tag v0.1.0-alpha.1 && git push origin v0.1.0-alpha.1
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# A moved tag queues behind the run already in progress instead of racing it
# to upload assets and push the image.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.50.1

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      build_name: ${{ steps.v.outputs.build_name }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Full history, so the tagged commit can be checked against main.
          fetch-depth: 0
      - id: v
        run: |
          tag="${GITHUB_REF_NAME}"
          # Only plain version tags: everything below uses the tag in commands.
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag $tag is not a version like v1.2.3 or v1.2.3-alpha.1"; exit 1
          fi
          # Releases come only from reviewed code: the tagged commit must be on main.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $tag points to $GITHUB_SHA, which is not on main. Tag a commit on main."; exit 1
          fi
          core="${tag#v}"
          core="${core%%-*}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # App stores want plain x.y.z; the full tag stays in the file names.
          echo "build_name=$core" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"

  # The same checks as pull requests, on the tagged commit; nothing is built
  # or published unless they pass.
  ci:
    name: ci
    needs: version
    uses: ./.github/workflows/ci.yml

  server:
    name: server ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: [version, ci]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          name="splitspends-server-${TAG}-${GOOS}-${GOARCH}"
          mkdir -p "dist/$name"
          go build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o "dist/$name/splitspends$ext" ./apps/api
          go build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o "dist/$name/splitspends-mcp$ext" ./apps/mcp
          cp LICENSE README.md "dist/$name/"
          cp apps/api/.env.example "dist/$name/env.example"
          cd dist
          if [ "$GOOS" = windows ]; then zip -qr "$name.zip" "$name"; else tar -czf "$name.tar.gz" "$name"; fi
          rm -rf "$name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  web:
    name: web
    needs: [version, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - name: Build and package
        env:
          TAG: ${{ needs.version.outputs.tag }}
          BUILD_NAME: ${{ needs.version.outputs.build_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        working-directory: apps/web
        run: |
          flutter build web --release --no-web-resources-cdn \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          mkdir -p ../../dist
          tar -C build -czf "../../dist/splitspends-web-${TAG}.tar.gz" web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-web
          path: dist/*

  android:
    name: android
    needs: [version, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - name: Build
        # Without the signing secrets the APK is signed with the debug key:
        # fine to install directly, not accepted by Google Play. The key is
        # written and removed within this step so no later step can read it.
        env:
          TAG: ${{ needs.version.outputs.tag }}
          BUILD_NAME: ${{ needs.version.outputs.build_name }}
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: apps/apk
        run: |
          trap 'rm -f android/upload-keystore.jks android/key.properties' EXIT
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > android/upload-keystore.jks
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$PWD/android/upload-keystore.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          else
            echo "No signing secrets: using the debug key."
          fi
          flutter build apk --release \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          mkdir -p ../../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../../dist/splitspends-android-${TAG}.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-android
          path: dist/*

  ios:
    name: ios (unsigned)
    needs: [version, ci]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - name: Build an unsigned IPA
        # Installing needs your own signing (Xcode, AltStore, Sideloadly) until
        # the project has an Apple Developer account in CI.
        env:
          TAG: ${{ needs.version.outputs.tag }}
          BUILD_NAME: ${{ needs.version.outputs.build_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        working-directory: apps/ios
        run: |
          flutter build ios --release --no-codesign \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          mkdir -p Payload ../../dist
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr "../../dist/splitspends-ios-${TAG}-unsigned.ipa" Payload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-ios
          path: dist/*

  docker:
    name: docker image
    needs: [version, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        env:
          # No build record artifact; the release only needs the image.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: VERSION=${{ needs.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.tag }}
            org.opencontainers.image.title=Split Spends
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.version.outputs.tag }}
            ${{ needs.version.outputs.prerelease == 'false' && format('{0}:latest', steps.image.outputs.name) || '' }}

  release:
    name: publish
    needs: [version, ci, server, web, android, ios, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          # Only this workflow's files: the Docker job also stores a build
          # record artifact (*.dockerbuild) that download-artifact cannot fetch.
          pattern: release-*
          merge-multiple: true
      - name: Checksums and notes
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          cd dist && sha256sum * > SHA256SUMS && cd ..
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${TAG}"
          sed -e "s|{{TAG}}|${TAG}|g" -e "s|{{IMAGE}}|${image}|g" .github/release-notes.md > notes.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Split Spends ${{ needs.version.outputs.tag }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          body_path: notes.md
          generate_release_notes: true
          files: dist/*
