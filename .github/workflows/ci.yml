name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The Android emulator job is slow (about 15 minutes), so it only runs when
  # started by hand (Actions, CI, Run workflow) and on the weekly schedule.
  workflow_dispatch:
  # The release workflow runs these checks on the tagged commit first.
  workflow_call:
  # Weekly, so advisories published after the last push still fail a run.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  go:
    name: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: splitspends
          POSTGRES_PASSWORD: splitspends
          POSTGRES_DB: splitspends_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U splitspends"
          --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l apps packages)" || (gofmt -l apps packages && exit 1)
      - run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Built from source with the Go version above (go.mod), which the
          # prebuilt binaries of this release are too old for. Keep the
          # version in step with GOLANGCI in the Makefile.
          version: v2.5.0
          install-mode: goinstall
      # shellcheck comes with the ubuntu-latest image.
      - name: shellcheck
        run: shellcheck scripts/*/*.sh scripts/hooks/pre-commit
      - name: Unit, boundary and integration tests
        env:
          TEST_DATABASE_URL: postgres://splitspends:splitspends@localhost:5432/splitspends_test?sslmode=disable
        run: go test -count=1 ./...

  vuln:
    name: vuln
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: make vuln

  # Runs on every change rather than behind a paths filter, so it can be a
  # required check and the release gate covers the deployment files too.
  deploy:
    name: deployment files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Terraform format
        run: terraform fmt -check -recursive -diff deploy
      - name: Terraform validate and test
        run: |
          for d in deploy/aws deploy/gcp; do
            terraform -chdir="$d" init -backend=false -input=false || exit 1
            terraform -chdir="$d" validate || exit 1
            terraform -chdir="$d" test || exit 1
          done
      - name: Compose files
        env:
          POSTGRES_PASSWORD: ci
          DOMAIN: example.com
        # The stacks read an env_file the operator creates; an empty one is
        # enough to check the files themselves.
        run: |
          touch deploy/.env deploy/docker/.env
          docker compose -f docker-compose.yml config -q
          docker compose -f deploy/docker-compose.yml config -q
          docker compose -f deploy/docker/docker-compose.yml config -q
      # yq comes with the ubuntu-latest image.
      - name: Render blueprint parses
        run: yq e . render.yaml > /dev/null

  dart:
    name: app
    runs-on: ubuntu-latest
    # The client's server parity test imports on-device data into a running
    # API and compares the balances both sides compute.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: splitspends
          POSTGRES_PASSWORD: splitspends
          POSTGRES_DB: splitspends
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U splitspends"
          --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - id: flutter
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed packages/ledger packages/client apps/apk apps/ios apps/web
      - name: Analyze
        run: for d in packages/ledger packages/client apps/apk apps/ios apps/web; do (cd $d && flutter analyze) || exit 1; done
      - name: Web fallback fonts match the Flutter SDK
        run: scripts/fonts/fallback.sh check
      # This job has both gofmt and dart, which the hook's cases need.
      - name: Pre-commit hook
        run: scripts/ci/pre-commit-test.sh
      # Node.js (on the runner image) runs the ledger as compiled JavaScript,
      # with the integer rules of the web build.
      - name: Ledger tests on the VM and under Node.js
        run: dart test -p vm,node
        working-directory: packages/ledger
      - name: Start a development server for the parity test
        run: |
          go build -o bin/splitspends ./apps/api
          DATABASE_URL=postgres://splitspends:splitspends@localhost:5432/splitspends?sslmode=disable \
          SECRET_KEY=$(openssl rand -hex 32) SIGNUP_MODE=open LOG_FORMAT=text ADDR=:8080 SMTP_HOST= \
            nohup ./bin/splitspends > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8080/health && exit 0; sleep 1; done
          cat server.log; exit 1
      - run: flutter test
        working-directory: packages/client
        env:
          SPLITSPENDS_E2E_URL: http://localhost:8080
          SPLITSPENDS_E2E_LOG: ${{ github.workspace }}/server.log
      - name: Server log
        if: failure() || cancelled()
        run: cat server.log
      - run: flutter build web --release --no-web-resources-cdn
        working-directory: apps/web

  android:
    name: android emulator
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: splitspends
          POSTGRES_PASSWORD: splitspends
          POSTGRES_DB: splitspends
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U splitspends"
          --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - id: flutter
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - name: Start a development server for the device test
        run: |
          go build -o bin/splitspends ./apps/api
          DATABASE_URL=postgres://splitspends:splitspends@localhost:5432/splitspends?sslmode=disable \
          SECRET_KEY=$(openssl rand -hex 32) SIGNUP_MODE=open LOG_FORMAT=text ADDR=:8080 \
            nohup ./bin/splitspends > server.log 2>&1 &
          nohup python3 scripts/ci/codes.py server.log 8099 > codes.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8080/health && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: Build the release APK
        working-directory: apps/apk
        run: flutter build apk --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: splitspends-apk
          path: apps/apk/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app on an Android emulator
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          working-directory: apps/apk
          script: |
            ../../scripts/ci/device-test.sh --dart-define=SPLITSPENDS_TEST_SERVER=http://10.0.2.2:8080 --dart-define=SPLITSPENDS_TEST_CODES=http://10.0.2.2:8099
            ../../scripts/ci/release-smoke.sh build/app/outputs/flutter-apk/app-release.apk
      - name: The upload reached the server
        run: python3 scripts/ci/codes.py server.log --check device-test@example.com Cabin
      - name: Server log
        if: failure() || cancelled()
        run: cat server.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || cancelled()
        with:
          name: device-logcat
          path: |
            device-logcat.txt
            apps/apk/release-logcat.txt
          if-no-files-found: ignore
