# Local development database. The API and app run on the host (make dev).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: splitspends
      POSTGRES_USER: splitspends
      POSTGRES_PASSWORD: splitspends
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitspends -d splitspends"]
      interval: 3s
      retries: 20
volumes:
  pgdata:
