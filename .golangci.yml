version: "2"

# Go linting for the whole module. `make lint` and CI both build the pinned
# version with the Go release go.mod names.
run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose # HTTP response bodies are closed
    - copyloopvar
    - errorlint # errors.Is / errors.As instead of == and type switches
    - gosec # file paths and permissions, integer overflow, TLS and randomness
    - misspell
    - nilerr # returning nil after checking an error
    - noctx # outgoing HTTP requests carry a context
    - rowserrcheck # rows.Err() is checked
    - sqlclosecheck # rows are closed
    - unconvert
    - usestdlibvars # http.MethodGet and friends instead of literals
    - wastedassign
  settings:
    gosec:
      excludes:
        - G104 # unchecked errors: errcheck covers them, with the exclusions below
    errcheck:
      exclude-functions:
        # Best-effort writes to an HTTP client or a closing body.
        - (io.Closer).Close
        - (net/http.ResponseWriter).Write
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      # Tests may ignore errors from setup helpers and write fixtures with
      # ordinary permissions.
      - path: _test\.go
        linters: [errcheck, bodyclose, noctx, gosec]

formatters:
  enable:
    - gofmt
