<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SplitSpends: self-hosted shared expenses for groups and friends.">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5FAF7">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F1513">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SplitSpends">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>SplitSpends</title>
  <link rel="manifest" href="manifest.json">

  <!-- Link previews in chats and social sites. Relative URLs work for most
       apps; a host can make them absolute behind its own domain. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SplitSpends">
  <meta property="og:title" content="SplitSpends">
  <meta property="og:description" content="Split expenses, not friendships. Self-hosted shared expenses for groups and friends.">
  <meta property="og:image" content="social.png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="640">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    html, body { margin: 0; height: 100%; background: #F5FAF7; }
    @media (prefers-color-scheme: dark) { html, body { background: #0F1513; } }
    /* Shown until Flutter draws its first frame. */
    #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; transition: opacity .25s ease; }
    #splash img { width: 88px; height: 88px; animation: breathe 1.6s ease-in-out infinite; }
    #splash.gone { opacity: 0; pointer-events: none; }
    @keyframes breathe { 50% { transform: scale(.94); opacity: .85; } }
    @media (prefers-reduced-motion: reduce) { #splash img { animation: none; } }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true"><img src="favicon.svg" alt=""></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('gone');
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
